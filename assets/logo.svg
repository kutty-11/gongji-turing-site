<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="工极图灵">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- 底座：圆角方块 -->
  <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#g)"/>
  <!-- 高光 -->
  <path d="M0 22C0 9.85 9.85 0 22 0h52c12.15 0 22 9.85 22 22v6C96 15.6 75.6 8 48 8S0 15.6 0 28z" fill="#ffffff" opacity=".12"/>

  <!-- “工”字骨架（用几何笔画，避免依赖字体） -->
  <g stroke="url(#s)" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M30 32h36"/>          <!-- 上横 -->
    <path d="M48 32v32"/>          <!-- 竖 -->
    <path d="M30 64h36"/>          <!-- 下横 -->
  </g>

  <!-- 图灵节点：右侧电路点（象征智能） -->
  <g fill="#00d3a7">
    <circle cx="76" cy="40" r="4.2"/>
    <circle cx="76" cy="56" r="4.2"/>
  </g>
  <g stroke="#00d3a7" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M60 40h11"/>
    <path d="M60 56h11"/>
  </g>
</svg>
